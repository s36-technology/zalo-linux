<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZaloCall Linux</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #111318;
      color: #f5f7fb;
    }

    body {
      display: grid;
      place-items: stretch;
    }

    .call {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #1e242d 0%, #111318 68%);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 24px 16px;
      text-align: center;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #2b7de9;
      color: white;
      font-size: 46px;
      font-weight: 700;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status {
      margin: 0;
      min-height: 24px;
      color: #a9b3c2;
      font-size: 14px;
    }

    .media {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      min-height: 28px;
    }

    .devices {
      width: min(100%, 312px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
      position: relative;
    }

    .device-button {
      min-width: 0;
      min-height: 42px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 9px;
      background: #1a2029;
      color: #f5f7fb;
      text-align: left;
      font-size: 13px;
    }

    .device-button span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-button:hover,
    .device-button[aria-expanded="true"] {
      background: #252c37;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .device-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 10;
      display: grid;
      gap: 4px;
      max-height: 178px;
      overflow: auto;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #1a2029;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.34);
    }

    .device-menu[hidden] {
      display: none;
    }

    .device-option {
      min-height: 34px;
      border-radius: 6px;
      padding: 7px 9px;
      background: transparent;
      color: #f5f7fb;
      text-align: left;
      font-size: 13px;
    }

    .device-option:hover,
    .device-option.selected {
      background: rgba(255, 255, 255, 0.1);
    }

    .pill {
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #d7dce5;
      font-size: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 22px 24px 28px;
      background: rgba(0, 0, 0, 0.16);
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .hangup {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e5484d;
      color: white;
      font-size: 24px;
      box-shadow: 0 14px 28px rgba(229, 72, 77, 0.26);
    }

    .answer {
      min-width: 104px;
      height: 56px;
      padding: 0 22px;
      border-radius: 999px;
      background: #20b26b;
      color: white;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 14px 28px rgba(32, 178, 107, 0.24);
    }

    .answer:hover {
      background: #179b5b;
    }

    .hangup:hover {
      background: #d83d42;
    }

    button:disabled {
      cursor: default;
      opacity: 0.56;
    }
  </style>
</head>
<body>
  <div class="call">
    <main class="main">
      <div class="avatar" id="avatar">Z</div>
      <h1 id="name">ZaloCall</h1>
      <p class="status" id="status">Connecting...</p>
      <div class="media" id="media"></div>
      <div class="devices" id="devices">
        <button class="device-button" id="mic" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span>Mic</span>
          <span id="micLabel">System default</span>
        </button>
        <button class="device-button" id="speaker" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span>Speaker</span>
          <span id="speakerLabel">System default</span>
        </button>
        <div class="device-menu" id="deviceMenu" role="listbox" hidden></div>
      </div>
    </main>
    <div class="controls">
      <button class="answer" id="answer" title="Answer call" aria-label="Answer call" hidden>Answer</button>
      <button class="hangup" id="hangup" title="End call" aria-label="End call">x</button>
    </div>
  </div>

  <script>
    const avatar = document.getElementById('avatar');
    const nameEl = document.getElementById('name');
    const statusEl = document.getElementById('status');
    const mediaEl = document.getElementById('media');
    const devicesEl = document.getElementById('devices');
    const micButton = document.getElementById('mic');
    const speakerButton = document.getElementById('speaker');
    const micLabel = document.getElementById('micLabel');
    const speakerLabel = document.getElementById('speakerLabel');
    const deviceMenu = document.getElementById('deviceMenu');
    const answer = document.getElementById('answer');
    const hangup = document.getElementById('hangup');
    let currentCall = {};
    let timer = null;
    let ending = false;
    let activeDeviceMenu = null;
    let hangupGuardUntil = 0;
    let hangupGuardTimer = null;
    const ANSWER_HANGUP_GUARD_MS = 5000;
    const ringback = {
      active: false,
      context: null,
      interval: null,
      timers: [],
      oscillators: []
    };

    function render(call) {
      currentCall = call || {};
      ending = false;
      const displayName = currentCall.calleeName || currentCall.calleeId || 'ZaloCall';
      nameEl.textContent = displayName;
      avatar.textContent = String(displayName).trim().charAt(0).toUpperCase() || 'Z';

      mediaEl.innerHTML = '';
      addPill(currentCall.isVideo ? 'Video call' : 'Audio call');
      if (currentCall.incoming && !currentCall.answeredAt) addPill('Incoming');
      if (currentCall.ringing) addPill('Ringing');
      if (currentCall.media && currentCall.media.sendOnly) addPill('Mic sending');
      if (currentCall.media && currentCall.media.receive) addPill('Speaker receiving');
      if (currentCall.media && currentCall.media.remoteRtpAddress) addPill(currentCall.media.remoteRtpAddress);
      renderDeviceSelects(currentCall);

      answer.hidden = !(currentCall.incoming && !currentCall.answeredAt);
      answer.disabled = false;
      syncHangupGuard();
      syncRingback();
      updateDuration();
      syncDurationTimer();
    }

    function addPill(text) {
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = text;
      mediaEl.appendChild(pill);
    }

    function renderDeviceSelects(call) {
      const devices = call.devices || {};
      const inputs = devices.audioInputDevices || [];
      const outputs = devices.audioOutputDevices || [];
      devicesEl.hidden = !inputs.length && !outputs.length;
      updateDeviceButton(micButton, micLabel, inputs, call.selectedAudioInput || devices.defaultAudInputDevice);
      updateDeviceButton(speakerButton, speakerLabel, outputs, call.selectedAudioOutput || devices.defaultAudOutputDevice);
      micButton.disabled = !inputs.length;
      speakerButton.disabled = !outputs.length;
    }

    function updateDeviceButton(button, label, devices, selectedId) {
      const selected = devices.find((device) => getDeviceId(device) === selectedId);
      label.textContent = selected ? getDeviceName(selected) : 'System default';
      button.dataset.value = selected ? getDeviceId(selected) : '';
    }

    function getDeviceId(device) {
      return String(device && (device.id || device.i || device.device || device.name) || '');
    }

    function getDeviceName(device) {
      return String(device && (device.name || device.n || device.id) || 'Audio device');
    }

    function toggleDeviceMenu(kind) {
      if (activeDeviceMenu === kind) {
        closeDeviceMenu();
        return;
      }

      openDeviceMenu(kind);
    }

    function openDeviceMenu(kind) {
      const devices = currentCall.devices || {};
      const list = kind === 'input' ?
        devices.audioInputDevices || [] :
        devices.audioOutputDevices || [];
      const selectedId = kind === 'input' ?
        currentCall.selectedAudioInput || devices.defaultAudInputDevice || '' :
        currentCall.selectedAudioOutput || devices.defaultAudOutputDevice || '';

      deviceMenu.innerHTML = '';
      appendDeviceOption(kind, '', 'System default', !selectedId);
      for (const device of list) {
        const id = getDeviceId(device);
        appendDeviceOption(kind, id, getDeviceName(device), id === selectedId);
      }

      activeDeviceMenu = kind;
      deviceMenu.hidden = false;
      micButton.setAttribute('aria-expanded', kind === 'input' ? 'true' : 'false');
      speakerButton.setAttribute('aria-expanded', kind === 'output' ? 'true' : 'false');
    }

    function appendDeviceOption(kind, id, label, selected) {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = `device-option${selected ? ' selected' : ''}`;
      option.textContent = label;
      option.dataset.kind = kind;
      option.dataset.id = id;
      option.setAttribute('role', 'option');
      option.setAttribute('aria-selected', selected ? 'true' : 'false');
      option.addEventListener('click', () => selectAudioDevice(kind, id));
      deviceMenu.appendChild(option);
    }

    function selectAudioDevice(kind, id) {
      if (kind === 'input') {
        currentCall.selectedAudioInput = id || null;
        currentCall.selectedAudioOutput = speakerButton.dataset.value || currentCall.selectedAudioOutput || null;
      } else {
        currentCall.selectedAudioOutput = id || null;
        currentCall.selectedAudioInput = micButton.dataset.value || currentCall.selectedAudioInput || null;
      }
      renderDeviceSelects(currentCall);
      closeDeviceMenu();
      window.zaloCallWindow.changeAudioDevice(
        currentCall.selectedAudioInput || null,
        currentCall.selectedAudioOutput || null
      );
    }

    function closeDeviceMenu() {
      activeDeviceMenu = null;
      deviceMenu.hidden = true;
      deviceMenu.innerHTML = '';
      micButton.setAttribute('aria-expanded', 'false');
      speakerButton.setAttribute('aria-expanded', 'false');
    }

    function updateDuration() {
      if (ending) return;

      const baseTime = currentCall.answeredAt || currentCall.startedAt || Date.now();
      const elapsed = Math.max(0, Math.floor((Date.now() - baseTime) / 1000));
      const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const seconds = String(elapsed % 60).padStart(2, '0');
      if (currentCall.answeredAt) {
        statusEl.textContent = `In call ${minutes}:${seconds}`;
        return;
      }

      if (currentCall.connecting) {
        statusEl.textContent = 'Connecting...';
        return;
      }

      statusEl.textContent = currentCall.incoming ? 'Incoming call' : 'Calling...';
    }

    function syncDurationTimer() {
      if (currentCall.answeredAt && !timer) {
        timer = setInterval(updateDuration, 1000);
        return;
      }

      if (!currentCall.answeredAt && timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function syncRingback() {
      if (currentCall.ringing && !currentCall.answeredAt && !ending) {
        startRingback();
      } else {
        stopRingback();
      }
    }

    function startRingback() {
      if (ringback.active) return;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      ringback.active = true;
      ringback.context = ringback.context || new AudioContext();
      ringback.context.resume().catch(() => {});
      playRingbackBurst();
      ringback.interval = setInterval(playRingbackBurst, 3600);
    }

    function playRingbackBurst() {
      if (!ringback.active || !ringback.context) return;

      const context = ringback.context;
      const start = context.currentTime;
      const gain = context.createGain();
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.08, start + 0.03);
      gain.gain.setValueAtTime(0.08, start + 1.15);
      gain.gain.linearRampToValueAtTime(0, start + 1.25);
      gain.connect(context.destination);

      const first = createRingbackOscillator(context, 440);
      const second = createRingbackOscillator(context, 480);
      first.connect(gain);
      second.connect(gain);
      ringback.oscillators.push(first, second);
      first.start(start);
      second.start(start);
      first.stop(start + 1.28);
      second.stop(start + 1.28);

      const timerId = setTimeout(() => {
        stopOscillator(first);
        stopOscillator(second);
        try {
          gain.disconnect();
        } catch (_) {}
      }, 1400);
      ringback.timers.push(timerId);
    }

    function createRingbackOscillator(context, frequency) {
      const oscillator = context.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, context.currentTime);
      return oscillator;
    }

    function stopRingback() {
      ringback.active = false;
      if (ringback.interval) {
        clearInterval(ringback.interval);
        ringback.interval = null;
      }

      for (const timerId of ringback.timers.splice(0)) {
        clearTimeout(timerId);
      }

      for (const oscillator of ringback.oscillators.splice(0)) {
        stopOscillator(oscillator);
      }
    }

    function stopOscillator(oscillator) {
      try {
        oscillator.stop();
      } catch (_) {}
      try {
        oscillator.disconnect();
      } catch (_) {}
    }

    function isHangupGuarded() {
      return Date.now() < hangupGuardUntil;
    }

    function syncHangupGuard() {
      hangup.disabled = isHangupGuarded();

      if (hangupGuardTimer) {
        clearTimeout(hangupGuardTimer);
        hangupGuardTimer = null;
      }

      if (hangup.disabled) {
        hangupGuardTimer = setTimeout(syncHangupGuard, Math.max(0, hangupGuardUntil - Date.now()));
      }
    }

    function guardHangupAfterAnswer() {
      hangupGuardUntil = Date.now() + ANSWER_HANGUP_GUARD_MS;
      syncHangupGuard();
    }

    answer.addEventListener('click', () => {
      answer.disabled = true;
      guardHangupAfterAnswer();
      statusEl.textContent = 'Connecting...';
      window.zaloCallWindow.answer();
    });

    micButton.addEventListener('click', () => toggleDeviceMenu('input'));
    speakerButton.addEventListener('click', () => toggleDeviceMenu('output'));
    document.addEventListener('click', (event) => {
      if (!devicesEl.contains(event.target)) {
        closeDeviceMenu();
      }
    });

    hangup.addEventListener('click', () => {
      if (isHangupGuarded()) {
        syncHangupGuard();
        return;
      }

      ending = true;
      stopRingback();
      window.zaloCallWindow.hangup();
      hangup.disabled = true;
      statusEl.textContent = 'Ending...';
    });

    window.addEventListener('beforeunload', stopRingback);
    window.zaloCallWindow.onUpdate(render);
    window.zaloCallWindow.getCallInfo().then(render);
    window.zaloCallWindow.ready();
  </script>
</body>
</html>
